rule: TAS-008
negative:
  files:
    playwright.config.ts: |
      import { defineConfig } from '@playwright/test';
      export default defineConfig({ forbidOnly: !!process.env.CI });
positive:
  files:
    playwright.config.ts: |
      import { defineConfig } from '@playwright/test';
      export default defineConfig({ use: { trace: 'on' } });
  expect: MISSING
