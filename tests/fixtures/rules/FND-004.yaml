rule: FND-004
negative:
  files:
    .github/settings.yml: |
      repository:
        name: app
      branches:
        - name: main
          protection:
            required_pull_request_reviews:
              required_approving_review_count: 1
              dismiss_stale_reviews: true
            required_status_checks:
              strict: true
              contexts: [ci]
positive:
  files:
    .github/workflows/ci.yml: |
      name: ci
      on: [push]
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - run: echo hi
  expect: MISSING
