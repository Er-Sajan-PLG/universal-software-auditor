name: Self audit

# USA audits itself on every PR. If this workflow fails, the tool regressed or
# the repo picked up a finding at or above the threshold.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 1 * *' # monthly drift check
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  usa:
    name: USA audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Run USA from source
        id: audit
        run: |
          node dist/cli.js audit . \
            --depth deep \
            --out AUDIT.md \
            --fail-on critical

      - name: Publish to job summary
        if: always()
        run: cat AUDIT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Score for the PR comment
        if: always()
        run: |
          SCORE=$(grep -m1 -oP '(?<=Overall Health Score: \*\*)[0-9.]+' AUDIT.md || echo '?')
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        id: score

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usa-audit
          path: AUDIT.md

      - name: Comment score on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: usa
          message: |
            ## 🧠 USA self-audit

            **Score: ${{ steps.score.outputs.score }}/100** · depth `deep`

            <details><summary>Full report</summary>

            See the artifact `usa-audit` on this run, or the job summary above.

            </details>
