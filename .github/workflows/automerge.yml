name: Automerge (patch/minor)

# Dependabot toil removal, tightly scoped: patch and minor updates merge
# themselves once CI is green. Majors stay manual (breaking changes deserve
# a human), and auto-merge waits for all required checks by construction.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge on patch/minor
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        # `github.event.number` (server-generated integer), never
        # `github.event.pull_request.*` text: SUP-008 forbids interpolating
        # event payloads into `run:` — even via `env:` — and numbers are the
        # injection-safe identifier `gh pr merge` accepts.
        run: gh pr merge --auto --squash "${{ github.event.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
