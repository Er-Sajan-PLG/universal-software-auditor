# The workspace map. It holds exactly one package: this repo root, which ships
# `@xenos1996/usa`.
#
# `packages/*` is absent because there is no packages/ directory yet. It was
# never what changed the release tag shape — that belief cost a release
# (2.25.3) before it was disproven. See docs/release.md ("The tag shape").
#
# The real mechanism, verified live: @manypkg/tools' PnpmTool.isMonorepoRoot
# returns true whenever this file has a `packages:` key, and it never counts
# the packages. `getPackages()` therefore reports tool.type "pnpm" even with
# exactly one package, so @changesets/cli's buildGitTag emits
# `${name}@${version}` and never `v${version}`. publish.yml matches both
# shapes (`v*` and `@xenos1996/usa@**`); do not narrow it back to `v*`.
packages:
  - '.'
