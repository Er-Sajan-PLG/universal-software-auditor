# =============================================================================
# USA — Documentation universe taxonomy  (schema: usa-doc-taxonomy-v1)
# -----------------------------------------------------------------------------
# The full documentation universe: 14 categories, 220 artifact types, the
# ownership class of each, when it is expected (tier), how the engine detects
# that it exists (patterns), when it applies to a project (applies_when over
# detector facts), which source changes can invalidate it (sources), and how
# artifacts depend on each other (derives_from / syncs_with).
#
# This is the single machine-readable home for every documentation obligation
# USA knows — no sync relationship lives only in human memory.
#
# Fields (per artifact)
#   id            global number 1..220 (Appendix A ordering)
#   cat           category id (A1..A14, see `categories` below)
#   name          artifact name
#   tier          0..4 — when the artifact is expected (Appendix B policy:
#                 Tier 0-1 from day one, Tier 2-3 progressively, Tier 4 as
#                 the project matures; see docs/documentation-audit.md)
#   kind          ownership class: canonical | derived | generated |
#                 reference | example | index
#   patterns      globs that detect presence. Leading `!` negates (e.g.
#                 '!README.md' excludes the root README from per-module
#                 matches). Empty list = not mechanically trackable: the
#                 engine reports it as MANUAL, never MISSING.
#   applies_when  optional predicate over detector facts (same shape as rule
#                 `applies_when`). Absent = always applicable.
#   sources       optional globs of source files whose change invalidates the
#                 artifact (impact analysis). `any-source` means any
#                 non-document change. Absent = no mechanical source linkage
#                 (human-governed artifact).
#   derives_from  ids of upstream artifacts: when an upstream is affected,
#                 this one is too (transitive impact walks these edges).
#   syncs_with    ids of peers that must stay mutually consistent.
#   alias_rule    id of an existing rule that already reports this artifact's
#                 absence (avoids double-counting in the main audit).
#   notes         optional free text.
#
# Honesty discipline: patterns must be specific enough that "present" means
# "this kind of document exists" — a bare '**/*.md' would make every artifact
# present, which is a silent false negative of every missing-document check.
# Artifacts that cannot be reliably matched get patterns: [] and MANUAL status.
# =============================================================================

schema: usa-doc-taxonomy-v1

